<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wide Test Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    .wide-block {
      width: 2000px;              /* ⭐ extremely wide */
      height: 200px;
      background: linear-gradient(90deg, #ff0000, #0000ff);
      border: 2px solid #333;
      margin-bottom: 20px;
    }

    .wide-block:nth-child(2) {
      background: linear-gradient(90deg, #00ff00, #ff00ff);
    }
  </style>
</head>
<body>
  <h1>Very Wide Test Page</h1>

  <div class="wide-block"></div>
  <div class="wide-block"></div>

  <p>This page is intentionally wider than the iframe to test horizontal scrolling.</p>
</body>
</html>
